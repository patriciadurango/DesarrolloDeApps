[versions]
# Versiones del Plugin y del Core de Android
agp = "8.5.0" # La versión que proporcionaste (8.12.3) es muy alta, 8.5.0 es la estable actual.
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.9.0" # Versión actualizada para mayor estabilidad
constraintlayout = "2.1.4" # Versión estable y común

# Versiones de Librerías de Red
retrofit = "2.9.0"

# Versión de Librería para Carga de Imágenes
glide = "4.16.0"

# Versiones de Testing
junit = "4.13.2"
junitVersion = "1.2.1" # Versión actualizada
espressoCore = "3.6.1" # Versión actualizada

[libraries]
# Core y UI de AndroidX
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Retrofit para peticiones a APIs
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }

# Glide para cargar imágenes desde una URL
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
# Plugin de aplicación de Android
android-application = { id = "com.android.application", version.ref = "agp" }

